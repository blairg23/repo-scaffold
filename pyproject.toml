[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "repo-scaffold"
version = "0.1.0"
description = "Generate an OS-agnostic GitHub repository scaffold for Go, Python, and React projects"
readme = "README.md"
authors = ["repo-scaffold"]
packages = [{ include = "repo_scaffold", from = "src" }]
include = ["src/repo_scaffold/templates/**/*"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
# Docker SDK: communicates with the Docker daemon via socket/named pipe.
# Preferred over raw urllib here because Docker's transport layer differs per OS
# (Unix socket on Linux/Mac, named pipe on Windows) -- the SDK abstracts this cleanly.
docker = ">=7.1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1"
pre-commit = ">=4.6.0"
tox = ">=4.20.0"

[tool.poetry.scripts]
repo-scaffold = "repo_scaffold.cli:main"

[tool.pytest.ini_options]
addopts = "-q -s"
testpaths = ["tests"]
markers = [
  "e2e_github: runs live GitHub end-to-end validation (opt-in, remote side effects)",
]

[tool.coverage.run]
branch = true
source = ["repo_scaffold"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
omit = [
  "src/repo_scaffold/__init__.py",
  "src/repo_scaffold/__main__.py",
]
exclude_also = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"
