[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-scaffold"
version = "0.1.0"
description = "Generate an OS-agnostic GitHub repository scaffold for Go, Python, and React projects"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "repo-scaffold" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
repo-scaffold = "repo_scaffold.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -s"
testpaths = ["tests"]
