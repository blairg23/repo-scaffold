[tox]
envlist = lint,type,test
isolated_build = true

[testenv]
basepython = python3.12
setenv =
    VIRTUALENV_OVERRIDE_APP_DATA={toxinidir}/.tox/venv_app_data

[testenv:test]
description = Run unit test suite
deps =
    pytest>=8
commands =
    pytest -q {posargs:tests}

[testenv:lint]
description = Run lint checks
skip_install = true
deps =
    black>=24
    ruff>=0.7
commands =
    black --check src tests
    ruff check src tests

[testenv:format]
description = Auto-format Python code
skip_install = true
deps =
    black>=24
    ruff>=0.7
commands =
    black src tests
    ruff check src tests --fix

[testenv:type]
description = Run static typing checks
skip_install = true
deps =
    mypy>=1.10
commands =
    mypy src
