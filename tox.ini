[tox]
envlist = lint,type,test
isolated_build = true

[testenv]
basepython = python3.12
setenv =
    VIRTUALENV_OVERRIDE_APP_DATA={toxinidir}/.tox/venv_app_data

[testenv:test]
description = Run unit test suite
deps =
    pytest>=8
commands =
    pytest -q {posargs:tests}

[testenv:test-fast]
description = Run fast unit checks used by pre-commit
deps =
    pytest>=8
commands =
    pytest -q -m "not e2e_github" {posargs:tests}

[testenv:lint]
description = Run lint checks
skip_install = true
deps =
    black>=24
    ruff>=0.7
commands =
    black --check src tests
    ruff check src tests --fix --exit-non-zero-on-fix

[testenv:format]
description = Auto-format Python code
skip_install = true
deps =
    black>=24
    ruff>=0.7
commands =
    black src tests
    ruff check src tests --fix

[testenv:type]
description = Run static typing checks
skip_install = true
deps =
    mypy>=1.10
commands =
    mypy src

[testenv:precommit]
description = Run full pre-commit tox suite
skip_install = true
depends =
    lint
    type
    test-fast
commands =
    python -c "print('tox precommit suite complete')"
