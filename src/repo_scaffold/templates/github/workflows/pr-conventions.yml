name: PR conventions

# Release notes are built from squash-merge commit subjects, which are PR titles.
# These two checks keep that trail intact: the title must be a Conventional
# Commit, and the body must link the ticket the PR closes.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            refactor
            docs
            test
            chore
            build
            ci
            style
          requireScope: false

  ticket-link:
    name: ticket-link
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user?.login ?? "";
            const head = pr.head?.ref ?? "";

            // Ticket-less by design: Dependabot, release-please's own release PRs,
            // and repo-scaffold's automated sync PRs.
            const ticketlessAuthors = ["dependabot[bot]"];
            const ticketlessBranchPrefixes = [
              "release-please--",
              "chore/sync-templates",
              "chore/sync-configs",
              "chore/add-dependabot-yml",
            ];
            if (
              ticketlessAuthors.includes(author) ||
              ticketlessBranchPrefixes.some((prefix) => head.startsWith(prefix))
            ) {
              core.info(`PR #${pr.number} is ticket-less by design; skipping.`);
              return;
            }

            // Template placeholders and examples sit in HTML comments; ignore them.
            const body = (pr.body ?? "").replace(/<!--[\s\S]*?-->/g, "");

            // GitHub closing keywords followed by #N, owner/repo#N, or an issue URL.
            const pattern =
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b:?\s+(?:https:\/\/github\.com\/([\w.-]+)\/([\w.-]+)\/issues\/(\d+)|(?:([\w.-]+)\/([\w.-]+))?#(\d+))/gi;

            const refs = [...body.matchAll(pattern)].map((m) => ({
              owner: m[1] ?? m[4] ?? context.repo.owner,
              repo: m[2] ?? m[5] ?? context.repo.repo,
              number: Number(m[3] ?? m[6]),
            }));

            if (refs.length === 0) {
              core.setFailed(
                "This PR does not link a ticket. Add a closing reference to the PR " +
                  "body, e.g. `Closes #123`, so release notes can trace the change " +
                  "from ticket to PR to commit."
              );
              return;
            }

            const isThisRepo = (ref) =>
              ref.owner.toLowerCase() === context.repo.owner.toLowerCase() &&
              ref.repo.toLowerCase() === context.repo.repo.toLowerCase();

            const problems = [];
            for (const ref of refs) {
              if (!isThisRepo(ref)) {
                // GITHUB_TOKEN cannot read other private repos, so accept as written.
                core.info(`Linked ticket: ${ref.owner}/${ref.repo}#${ref.number}`);
                return;
              }
              try {
                const { data } = await github.rest.issues.get({
                  owner: ref.owner,
                  repo: ref.repo,
                  issue_number: ref.number,
                });
                if (data.pull_request) {
                  problems.push(`#${ref.number} is a pull request, not an issue`);
                  continue;
                }
                core.info(`Linked ticket: #${ref.number}`);
                return;
              } catch (error) {
                if (error.status === 404) {
                  problems.push(`#${ref.number} does not exist`);
                  continue;
                }
                throw error;
              }
            }

            core.setFailed(
              `No closing reference points at an issue in this repo (${problems.join("; ")}).`
            );
